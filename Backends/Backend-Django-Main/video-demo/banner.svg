<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1400 420"
     width="1400"
     height="420">

  <defs>

    <!-- Background -->
    <linearGradient id="background"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>

    <!-- Brand -->
    <linearGradient id="brand"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Card -->
    <linearGradient id="card"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect
    x="0"
    y="0"
    width="1400"
    height="420"
    rx="20"
    fill="url(#background)"
  />

  <!-- Decorative circles -->
  <circle
    cx="1250"
    cy="60"
    r="170"
    fill="#22d3ee"
    opacity="0.05"
  />

  <circle
    cx="80"
    cy="390"
    r="160"
    fill="#34d399"
    opacity="0.04"
  />


  <!-- ================================================= -->
  <!-- LEFT SIDE -->
  <!-- ================================================= -->

  <g transform="translate(70 55)">

    <!-- Brand line -->
    <rect
      x="0"
      y="0"
      width="70"
      height="5"
      rx="3"
      fill="url(#brand)"
    />

    <!-- Logo -->
    <text
      x="0"
      y="75"
      font-family="Arial, Helvetica, sans-serif"
      font-size="58"
      font-weight="700"
      letter-spacing="3"
      fill="#ffffff">
      MEDEXA
    </text>

    <!-- Subtitle -->
    <text
      x="2"
      y="108"
      font-family="Arial, Helvetica, sans-serif"
      font-size="16"
      font-weight="600"
      letter-spacing="1.5"
      fill="#38bdf8">
      AI-POWERED HEALTHCARE PLATFORM
    </text>

    <!-- Description -->
    <text
      x="2"
      y="155"
      font-family="Arial, Helvetica, sans-serif"
      font-size="17"
      fill="#94a3b8">
      Hospital management, clinical analytics,
    </text>

    <text
      x="2"
      y="181"
      font-family="Arial, Helvetica, sans-serif"
      font-size="17"
      fill="#94a3b8">
      and AI-powered risk prediction in one platform.
    </text>


    <!-- ================================================= -->
    <!-- FEATURE TAGS -->
    <!-- ================================================= -->

    <!-- AI -->
    <rect
      x="0"
      y="220"
      width="145"
      height="40"
      rx="8"
      fill="url(#card)"
      stroke="#22d3ee"
      stroke-opacity="0.35"
    />

    <circle
      cx="20"
      cy="240"
      r="5"
      fill="#22d3ee"
    />

    <text
      x="35"
      y="245"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      font-weight="600"
      fill="#e2e8f0">
      AI Prediction
    </text>


    <!-- Analytics -->
    <rect
      x="158"
      y="220"
      width="145"
      height="40"
      rx="8"
      fill="url(#card)"
      stroke="#34d399"
      stroke-opacity="0.35"
    />

    <circle
      cx="178"
      cy="240"
      r="5"
      fill="#34d399"
    />

    <text
      x="193"
      y="245"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      font-weight="600"
      fill="#e2e8f0">
      Analytics
    </text>


    <!-- API -->
    <rect
      x="316"
      y="220"
      width="125"
      height="40"
      rx="8"
      fill="url(#card)"
      stroke="#38bdf8"
      stroke-opacity="0.35"
    />

    <circle
      cx="336"
      cy="240"
      r="5"
      fill="#38bdf8"
    />

    <text
      x="351"
      y="245"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      font-weight="600"
      fill="#e2e8f0">
      Secure API
    </text>


    <!-- Bottom -->
    <text
      x="2"
      y="320"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      fill="#64748b">
      FULL-STACK • AI/ML • SECURITY • APIs • REDIS • DATABASES
    </text>

  </g>


  <!-- ================================================= -->
  <!-- RIGHT SIDE -->
  <!-- ================================================= -->

  <g transform="translate(650 45)">

    <!-- Main architecture card -->
    <rect
      x="0"
      y="0"
      width="680"
      height="325"
      rx="18"
      fill="url(#card)"
      stroke="#38bdf8"
      stroke-opacity="0.18"
    />


    <!-- Header -->
    <text
      x="30"
      y="42"
      font-family="Arial, Helvetica, sans-serif"
      font-size="18"
      font-weight="700"
      fill="#ffffff">
      MEDEXA SYSTEM
    </text>

    <text
      x="30"
      y="66"
      font-family="Arial, Helvetica, sans-serif"
      font-size="12"
      fill="#64748b">
      MODERN HEALTHCARE SOFTWARE ARCHITECTURE
    </text>


    <!-- ================================================= -->
    <!-- FRONTEND -->
    <!-- ================================================= -->

    <rect
      x="30"
      y="95"
      width="180"
      height="65"
      rx="10"
      fill="#0f2032"
      stroke="#38bdf8"
      stroke-opacity="0.35"
    />

    <text
      x="50"
      y="121"
      font-family="Arial, Helvetica, sans-serif"
      font-size="14"
      font-weight="700"
      fill="#ffffff">
      NEXT.JS
    </text>

    <text
      x="50"
      y="143"
      font-family="Arial, Helvetica, sans-serif"
      font-size="11"
      fill="#94a3b8">
      Clinical Dashboard
    </text>


    <!-- Arrow -->
    <line
      x1="215"
      y1="127"
      x2="265"
      y2="127"
      stroke="#38bdf8"
      stroke-width="2"
    />

    <polygon
      points="265,127 255,122 255,132"
      fill="#38bdf8"
    />


    <!-- ================================================= -->
    <!-- BACKEND -->
    <!-- ================================================= -->

    <rect
      x="270"
      y="95"
      width="180"
      height="65"
      rx="10"
      fill="#10231f"
      stroke="#34d399"
      stroke-opacity="0.35"
    />

    <text
      x="290"
      y="121"
      font-family="Arial, Helvetica, sans-serif"
      font-size="14"
      font-weight="700"
      fill="#ffffff">
      DJANGO REST
    </text>

    <text
      x="290"
      y="143"
      font-family="Arial, Helvetica, sans-serif"
      font-size="11"
      fill="#94a3b8">
      Secure API Layer
    </text>


    <!-- Arrow -->
    <line
      x1="455"
      y1="127"
      x2="505"
      y2="127"
      stroke="#34d399"
      stroke-width="2"
    />

    <polygon
      points="505,127 495,122 495,132"
      fill="#34d399"
    />


    <!-- ================================================= -->
    <!-- AI -->
    <!-- ================================================= -->

    <rect
      x="510"
      y="95"
      width="140"
      height="65"
      rx="10"
      fill="#171d32"
      stroke="#a78bfa"
      stroke-opacity="0.35"
    />

    <text
      x="530"
      y="121"
      font-family="Arial, Helvetica, sans-serif"
      font-size="14"
      font-weight="700"
      fill="#ffffff">
      AI / ML
    </text>

    <text
      x="530"
      y="143"
      font-family="Arial, Helvetica, sans-serif"
      font-size="11"
      fill="#94a3b8">
      Inference
    </text>


    <!-- ================================================= -->
    <!-- PLATFORM COMPONENTS -->
    <!-- ================================================= -->

    <text
      x="30"
      y="205"
      font-family="Arial, Helvetica, sans-serif"
      font-size="12"
      font-weight="600"
      fill="#64748b">
      PLATFORM SERVICES
    </text>


    <!-- Redis -->
    <rect
      x="30"
      y="225"
      width="125"
      height="55"
      rx="9"
      fill="#101a2a"
      stroke="#22d3ee"
      stroke-opacity="0.25"
    />

    <text
      x="50"
      y="249"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      font-weight="700"
      fill="#ffffff">
      REDIS
    </text>

    <text
      x="50"
      y="267"
      font-family="Arial, Helvetica, sans-serif"
      font-size="10"
      fill="#64748b">
      Rate Limiting
    </text>


    <!-- Database -->
    <rect
      x="170"
      y="225"
      width="125"
      height="55"
      rx="9"
      fill="#101a2a"
      stroke="#38bdf8"
      stroke-opacity="0.25"
    />

    <text
      x="190"
      y="249"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      font-weight="700"
      fill="#ffffff">
      DATABASE
    </text>

    <text
      x="190"
      y="267"
      font-family="Arial, Helvetica, sans-serif"
      font-size="10"
      fill="#64748b">
      PostgreSQL
    </text>


    <!-- Security -->
    <rect
      x="310"
      y="225"
      width="145"
      height="55"
      rx="9"
      fill="#101a2a"
      stroke="#34d399"
      stroke-opacity="0.25"
    />

    <text
      x="330"
      y="249"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      font-weight="700"
      fill="#ffffff">
      SECURITY
    </text>

    <text
      x="330"
      y="267"
      font-family="Arial, Helvetica, sans-serif"
      font-size="10"
      fill="#64748b">
      JWT • API Keys
    </text>


    <!-- Analytics -->
    <rect
      x="470"
      y="225"
      width="180"
      height="55"
      rx="9"
      fill="#101a2a"
      stroke="#a78bfa"
      stroke-opacity="0.25"
    />

    <text
      x="490"
      y="249"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      font-weight="700"
      fill="#ffffff">
      ANALYTICS
    </text>

    <text
      x="490"
      y="267"
      font-family="Arial, Helvetica, sans-serif"
      font-size="10"
      fill="#64748b">
      Clinical Intelligence
    </text>

  </g>

</svg>
